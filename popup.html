<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Jurnal Helper</title>
  <style>
    :root {
      --ink: #111111;
      --paper: #f4f1ea;
      --white: #ffffff;
      --yellow: #ffd93d;
      --cyan: #5ce1e6;
      --pink: #ff6b9d;
      --purple: #b39ddb;
      --green: #4ade80;
      --red: #ff5757;
      --muted: #6b7280;
      --shadow: 4px 4px 0 var(--ink);
      --radius: 14px;
      --ease-bounce: cubic-bezier(.34, 1.56, .64, 1);
    }

    * { box-sizing: border-box; }

    .app {
      position: relative;
      z-index: 1;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--paper);
      color: var(--ink);
      overflow-x: hidden;
      position: relative;
    }

    /* ---------- Animated background ---------- */
    .aurora {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .aurora span {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      filter: blur(42px);
      opacity: .5;
      animation: drift 14s ease-in-out infinite alternate;
    }
    .aurora span:nth-child(1) { background: var(--cyan); top: -60px; left: -50px; }
    .aurora span:nth-child(2) { background: var(--pink); top: 40%; right: -80px; animation-delay: -4s; }
    .aurora span:nth-child(3) { background: var(--yellow); bottom: -70px; left: 10%; animation-delay: -8s; }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(18px, -22px) scale(1.15); }
      100% { transform: translate(-14px, 16px) scale(.95); }
    }

    /* ---------- Header ---------- */
    .app-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      animation: fadeUp .5s var(--ease-bounce) both;
    }

    .logo-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 3px solid var(--ink);
      border-radius: 12px;
      background: var(--yellow);
      box-shadow: var(--shadow);
      font-size: 22px;
      animation: floaty 4s ease-in-out infinite;
    }
    .logo-wrap::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 16px;
      border: 2px dashed rgba(17,17,17,.18);
      animation: spinSlow 18s linear infinite;
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes spinSlow { to { transform: rotate(360deg); } }

    .app-title { flex: 1; min-width: 0; }
    .app-title h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -.4px;
      text-transform: uppercase;
    }
    .app-title p {
      margin: 2px 0 0;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--muted);
    }

    .status-badge {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .5px;
      padding: 5px 9px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--green);
      box-shadow: 2px 2px 0 var(--ink);
      transition: background .25s, transform .25s var(--ease-bounce);
    }
    .status-badge.off {
      background: #d1d5db;
      color: #6b7280;
      transform: scale(.96);
    }

    /* ---------- Cards ---------- */
    .card {
      background: var(--white);
      border: 3px solid var(--ink);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px 14px;
      margin-bottom: 11px;
      transition: transform .2s var(--ease-bounce), box-shadow .2s;
      animation: fadeUp .5s var(--ease-bounce) both;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 6px 6px 0 var(--ink); }

    .card:nth-of-type(1) { animation-delay: .04s; }
    .card:nth-of-type(2) { animation-delay: .1s; }
    .card:nth-of-type(3) { animation-delay: .16s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Status card ---------- */
    .status-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }
    .status-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(92,225,230,.25), transparent 60%);
      opacity: 0;
      transition: opacity .35s;
    }
    .status-card.is-off::before { opacity: 0; }
    .status-card:not(.is-off)::before { opacity: 1; }

    .status-info {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 1;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 0 rgba(74,222,128,.6);
      animation: pulseDot 1.8s infinite;
    }
    .is-off .status-dot {
      background: #9ca3af;
      box-shadow: none;
      animation: none;
    }
    @keyframes pulseDot {
      0% { box-shadow: 0 0 0 0 rgba(74,222,128,.6); }
      70% { box-shadow: 0 0 0 8px rgba(74,222,128,0); }
      100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
    }

    .status-info .label {
      margin: 0;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .status-info .value {
      margin: 1px 0 0;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: -.2px;
    }

    /* ---------- Toggle switch ---------- */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
      flex-shrink: 0;
      z-index: 1;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #e5e7eb;
      border: 3px solid var(--ink);
      border-radius: 999px;
      transition: background .3s, box-shadow .3s;
    }
    .slider::before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: var(--ink);
      border-radius: 50%;
      transition: transform .3s var(--ease-bounce);
    }
    input:checked + .slider { background-color: var(--cyan); box-shadow: 0 0 12px rgba(92,225,230,.7); }
    input:checked + .slider::before { transform: translateX(24px); }

    /* ---------- Speed segmented control ---------- */
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .card-head .hint {
      color: var(--ink);
      background: var(--yellow);
      padding: 2px 8px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      font-size: 9.5px;
      transition: transform .2s var(--ease-bounce);
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .segmented button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 4px;
      border: 2.5px solid var(--ink);
      border-radius: 10px;
      background: var(--white);
      font-family: inherit;
      font-size: 9.5px;
      font-weight: 900;
      letter-spacing: .2px;
      cursor: pointer;
      transition: transform .18s var(--ease-bounce), background .2s, color .2s, box-shadow .18s;
    }
    .segmented button .ico { font-size: 15px; line-height: 1; }
    .segmented button:hover { transform: translateY(-2px); box-shadow: 3px 3px 0 var(--ink); }
    .segmented button.active {
      background: var(--ink);
      color: var(--white);
      box-shadow: 2px 2px 0 rgba(17,17,17,.35);
      transform: translateY(-1px);
    }
    .segmented button.active .ico { animation: pop .35s var(--ease-bounce); }
    @keyframes pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }

    /* ---------- Auto next week card ---------- */
    .toggle-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .toggle-card .tc-text { display: flex; flex-direction: column; }
    .toggle-card .tc-title {
      font-size: 11.5px;
      font-weight: 900;
      letter-spacing: .2px;
    }
    .toggle-card .tc-sub {
      font-size: 9.5px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 1px;
    }

    /* ---------- Site note ---------- */
    .site-note {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 10px;
      font-weight: 700;
      padding: 8px 11px;
      margin-bottom: 10px;
      border: 2.5px dashed var(--ink);
      border-radius: 10px;
      background: #fff7d6;
      animation: fadeUp .4s var(--ease-bounce) both;
    }

    .stuck-note {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 10px;
      padding: 9px 11px;
      border: 2.5px dashed var(--ink);
      border-radius: 10px;
      background: #fff7d6;
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--muted);
      animation: fadeUp .5s var(--ease-bounce) both;
      animation-delay: .35s;
    }
    .stuck-note b { color: var(--ink); }
    .stuck-note .stuck-ico {
      flex-shrink: 0;
      font-size: 14px;
      line-height: 1.1;
    }

    /* ---------- Buttons ---------- */
    .actions { display: flex; flex-direction: column; gap: 9px; }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px 14px;
      border: 3px solid var(--ink);
      border-radius: 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .3px;
      text-transform: uppercase;
      cursor: pointer;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform .15s var(--ease-bounce), box-shadow .15s, background .2s, filter .2s;
      animation: fadeUp .45s var(--ease-bounce) both;
    }
    .btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
      transform: skewX(-18deg);
      transition: left .5s ease;
    }
    .btn:hover::after { left: 130%; }
    .btn:hover { transform: translate(-1px, -2px); box-shadow: 6px 6px 0 var(--ink); }
    .btn:active { transform: translate(2px, 2px); box-shadow: none; }
    .btn .ico { font-size: 15px; line-height: 1; }

    .btn-primary { background: var(--red); color: #fff; animation-delay: .2s; }
    .btn-secondary { background: var(--purple); color: var(--ink); animation-delay: .25s; }
    .btn-accent { background: var(--cyan); color: var(--ink); animation-delay: .25s; }
    .btn-ghost { background: var(--white); color: var(--ink); animation-delay: .3s; }
    .btn-danger { background: var(--yellow); color: var(--ink); }
    .btn-save { background: var(--green); color: var(--ink); }

    .btn:disabled {
      background: #e5e7eb;
      color: #9ca3af;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
      filter: grayscale(1);
    }
    .btn:disabled::after { display: none; }

    /* ---------- Running panel ---------- */
    .running {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 16px 14px;
      background: var(--white);
      border: 3px solid var(--ink);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      animation: fadeUp .35s var(--ease-bounce) both;
    }
    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid var(--ink);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .running-text { text-align: center; }
    .running-text p {
      margin: 0;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .2px;
    }
    .running-text span {
      display: block;
      margin-top: 2px;
      font-size: 9.5px;
      font-weight: 600;
      color: var(--muted);
    }

    .progress {
      width: 100%;
      height: 9px;
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      background: #f3f4f6;
      overflow: hidden;
    }
    .progress-bar {
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: repeating-linear-gradient(
        45deg,
        var(--cyan) 0 8px,
        var(--yellow) 8px 16px
      );
      background-size: 200% 100%;
      animation: slideBar 1.2s linear infinite;
    }
    @keyframes slideBar {
      0% { transform: translateX(-100%); background-position: 0 0; }
      100% { transform: translateX(320%); background-position: 32px 0; }
    }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translate(-50%, 130%);
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 280px;
      padding: 10px 14px;
      background: var(--ink);
      color: #fff;
      border: 2.5px solid var(--ink);
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,.3);
      font-size: 11px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: transform .35s var(--ease-bounce), opacity .3s;
      z-index: 999;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .toast.success { background: #16a34a; }
    .toast.error { background: var(--red); }
    .toast.warning { background: #d97706; }
    .toast .t-ico { font-size: 14px; }

    .hide { display: none !important; }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="aurora"><span></span><span></span><span></span></div>

  <div class="app">
  <header class="app-header">
    <div class="logo-wrap">📓</div>
    <div class="app-title">
      <h1>Jurnal Helper</h1>
      <p>Otomatis isi jurnal Kejar.id</p>
    </div>
    <div class="status-badge" id="statusBadge">ON</div>
  </header>

  <section class="card status-card" id="statusCard">
    <div class="status-info">
      <span class="status-dot"></span>
      <div>
        <p class="label">Status Ekstensi</p>
        <p class="value" id="statusText">Aktif</p>
      </div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggleExtension">
      <span class="slider"></span>
    </label>
  </section>

  <section class="card">
    <div class="card-head">
      <span>Kecepatan</span>
      <span class="hint" id="speedHint">Cepat</span>
    </div>
    <div class="segmented" id="speedSegmented" role="group" aria-label="Pilih kecepatan">
      <button type="button" data-speed="instant"><span class="ico">⚡</span><span>Instan</span></button>
      <button type="button" data-speed="fast"><span class="ico">🚀</span><span>Cepat</span></button>
      <button type="button" data-speed="normal"><span class="ico">🐢</span><span>Normal</span></button>
    </div>
    <select id="speedSelect" class="sr-only" tabindex="-1" aria-hidden="true">
      <option value="instant">Instan</option>
      <option value="fast" selected>Cepat</option>
      <option value="normal">Normal</option>
    </select>
  </section>

  <label class="card toggle-card hide" id="autoNextCard">
    <span class="tc-text">
      <span class="tc-title">Auto Lintas Minggu</span>
      <span class="tc-sub">Lanjut ke minggu berikutnya otomatis</span>
    </span>
    <span class="switch">
      <input type="checkbox" id="autoNextWeek">
      <span class="slider"></span>
    </span>
  </label>

  <div class="site-note hide" id="siteNote">
    <span>⚠️</span>
    <span>Buka <b>app.kejar.id</b> dulu untuk mulai.</span>
  </div>

  <div class="actions" id="actions">
    <button id="btnMulai" class="btn btn-primary"><span class="ico">🚀</span> Jurnal Harian</button>
    <button id="btnMulaiMingguan" class="btn btn-secondary"><span class="ico">📅</span> Jurnal Mingguan</button>
    <button id="btnAutoLintasMinggu" class="btn btn-accent hide"><span class="ico">⚡</span> Jalankan Auto Lintas Minggu</button>
    <button id="btnSettings" class="btn btn-ghost"><span class="ico">⚙️</span> Kustomisasi Aturan</button>
  </div>

  <div class="running hide" id="runningPanel">
    <div class="spinner"></div>
    <div class="running-text">
      <p>Sedang mengisi jurnal...</p>
      <span>Jangan tutup atau refresh halaman</span>
    </div>
    <div class="progress"><div class="progress-bar"></div></div>
    <button id="btnStop" class="btn btn-danger"><span class="ico">🛑</span> Berhenti</button>
  </div>

  <div class="stuck-note">
    <span class="stuck-ico">🛠️</span>
    <span><b>Stuck?</b> Klik <b>Berhenti</b>, lalu tekan <b>Ctrl + Shift + R</b>. Jurnal yang belum terisi bisa dijalankan ulang.</span>
  </div>

  <div class="toast" id="toast"><span class="t-ico"></span><span id="toastMsg"></span></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
