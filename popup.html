<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Jurnal Helper</title>
  <style>
    body {
      width: 260px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      background-color: #f3f4f6;
      color: #111;
    }

    h3 {
      font-size: 15px;
      font-weight: 900;
      margin-top: 0;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      text-align: center;
      border-bottom: 3px solid #111;
      padding-bottom: 6px;
    }

    .toggle-container, .control-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      background: #ffffff;
      padding: 10px 12px;
      border: 3px solid #111;
      border-radius: 6px;
      box-shadow: 3px 3px 0px #111;
      font-size: 12px;
      font-weight: 700;
    }

    select {
      padding: 4px 6px;
      border-radius: 4px;
      border: 2px solid #111;
      background-color: #ffde59;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #e5e7eb;
      border: 2px solid #111;
      transition: .2s;
      border-radius: 12px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background-color: #111;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #00f0ff; }
    input:checked + .slider:before { transform: translateX(20px); }

    button {
      width: 100%;
      padding: 10px;
      border: 3px solid #111;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      margin-top: 6px;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: none !important;
    }

    #btnMulai {
      background-color: #ff5757;
      color: #fff;
      box-shadow: 3px 3px 0px #111;
    }
    #btnMulai:hover { background-color: #ff3b3b; }

    #btnMulaiMingguan {
      background-color: #a78bfa; /* Ungu terang untuk mingguan */
      color: #fff;
      box-shadow: 3px 3px 0px #111;
    }
    #btnMulaiMingguan:hover { background-color: #8b5cf6; }

    #btnStop {
      background-color: #00f0ff;
      color: #111;
      box-shadow: 3px 3px 0px #111;
      display: none;
    }
    #btnStop:hover { background-color: #00d7e5; }

    button:disabled {
      background-color: #d1d5db;
      color: #9ca3af;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>
  <h3>Jurnal Helper</h3>
  
  <div class="toggle-container">
    <span>STATUS</span>
    <label class="switch">
      <input type="checkbox" id="toggleExtension">
      <span class="slider"></span>
    </label>
  </div>
  
  <div class="control-group">
    <label for="speedSelect">KECEPATAN:</label>
    <select id="speedSelect">
      <option value="instant">⚡ Instan</option>
      <option value="fast" selected>🚀 Cepat</option>
      <option value="normal">🐢 Normal</option>
    </select>
  </div>

  <button id="btnMulai">🚀 Jurnal Harian</button>
  <button id="btnMulaiMingguan">📅 Jurnal Mingguan</button>
  <button id="btnStop">🛑 Berhenti</button>

  <script src="popup.js"></script>
</body>
</html>
